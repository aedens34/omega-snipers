modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/yourname/omegasnipers/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# This is a TaCZ addon: it builds every Omega gun on top of a real, existing
# TaCZ gun id, so TaCZ (and whichever addons you also run) must load first.
[[dependencies.${mod_id}]]
    modId = "tacz"
    mandatory = true
    versionRange = "[1.20.1-1.1.0,)"
    ordering = "AFTER"
    side = "BOTH"
